<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
margin:0;
font-family:'Poppins', sans-serif;
background:linear-gradient(135deg,#1e3a8a 0%,#1d4ed8 50%,#2563eb 100%);
min-height:100vh;
color:#ffffff;
}

/* CONTAINER */
.container{
max-width:1000px;
margin:50px auto;
padding:20px;
}

/* TITLE */
.title{
text-align:center;
margin-bottom:30px;
}

.title h1{
color:#7dd3fc;
margin-bottom:5px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}

/* CARD */
.card{
background:linear-gradient(145deg,#1e40af,#1d4ed8);
border:1px solid rgba(255,255,255,0.2);
padding:25px;
border-radius:14px;
box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.card h2, .card h3{
color:#7dd3fc;
margin-bottom:15px;
}

/* INFO */
.info div{
margin-bottom:15px;
display:flex;
align-items:center;
gap:10px;
color:#f0f9ff;
}

.info i{
color:#7dd3fc;
}

/* SOCIAL */
.social a{
margin-right:10px;
font-size:22px;
color:#7dd3fc;
transition:0.3s;
}

.social a:hover{
color:#ffffff;
}

/* FORM */
form input, form textarea{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid rgba(255,255,255,0.3);
border-radius:8px;
background:#1e3a8a;
color:white;
outline:none;
font-family:'Poppins', sans-serif;
}

form input:focus, form textarea:focus{
border-color:#7dd3fc;
background:#1e40af;
}

button{
width:100%;
padding:12px;
background:#7dd3fc;
color:#1e3a8a;
border:none;
border-radius:8px;
font-weight:700;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#ffffff;
color:#1d4ed8;
}

/* MOBILE */
@media(max-width:768px){
.grid{grid-template-columns:1fr;}
}

</style>

</head>

<body>

<div id="header"></div>

<div class="container">

<!-- TITLE -->
<div class="title">
<h1>Contact Me</h1>
<p>Feel free to reach out for collaboration or queries</p>
</div>

<div class="grid">

<!-- LEFT INFO -->
<div class="card">

<h2>Contact Information</h2>

<div class="info">
<div><i class="fas fa-map-marker-alt"></i> Khulna University, Khulna-9208</div>
<div><i class="fas fa-phone"></i> +8801973827347</div>
<div><i class="fas fa-envelope"></i> mirazulislamku@gmail.com</div>
</div>

<h3>Connect</h3>

<div class="social">
<a href="https://www.facebook.com/miraz.ku06" target="_blank"><i class="fab fa-facebook"></i></a>
<a href="https://www.linkedin.com/" target="_blank"><i class="fab fa-linkedin"></i></a>
<a href="https://github.com/MirazKU" target="_blank"><i class="fab fa-github"></i></a>
</div>

</div>

<!-- RIGHT FORM -->
<div class="card">

<h2>Send Message</h2>

<form action="https://formspree.io/f/xjgpaopd" method="POST">

<input type="text" name="name" placeholder="Your Name" required>

<input type="email" name="email" placeholder="Your Email" required>

<textarea name="message" rows="5" placeholder="Your Message" required></textarea>

<button type="submit">Send Message</button>

</form>

</div>

</div>

</div>

<div id="footer"></div>

<script src="header.js"></script>
</body>
</html>
